<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · mso-pm</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --ink: #1b1b1f; --muted: #56565e; --line: #d6d5d0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --ink: #ededed; --muted: #a1a1a1; --line: #333333; } }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink);
         font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  main { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 360px; }
  .logo { width: 48px; height: 48px; border-radius: 12px; background: #2d55c8; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px; }
  h1 { margin: 8px 0 0; font-size: 22px; }
  p { margin: 0; color: var(--muted); line-height: 1.5; }
  button { margin-top: 8px; height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; font-weight: 500; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">m</div>
  <h1>You’re offline</h1>
  <p>mso-pm needs a connection to load your projects. Check your Wi-Fi or mobile data, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
