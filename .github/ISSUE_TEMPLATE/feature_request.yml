name: Feature request
description: An idea that would make mso-pm more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or situation, in your own words.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea for a solution, if you have one.
