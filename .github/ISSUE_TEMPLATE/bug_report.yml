name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Please don't file it here; see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project board
        2. Drag a task to Done
        3. Reload: it is back in Todo
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Hosted app (pm.mshinan.com) or your own copy? Which page?
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 141 on Windows, Safari on iPhone…
